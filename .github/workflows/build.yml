name: Build CoursePack Licence Generator

# Builds the Android licence generator in the cloud and uploads the APK.
# The owner's machine cannot install Flutter or the Android SDK, so all
# compilation happens here.
#
# One-time setup for a signed release APK:
#   Settings -> Secrets and variables -> Actions -> New repository secret:
#     KEYSTORE_BASE64    base64 of your coursepack-keystore.jks
#     KEYSTORE_PASSWORD  the store password
#     KEY_PASSWORD       the key password (usually the same)
#     KEY_ALIAS          coursepack
# Without these the workflow still builds a debug APK; do not ship it to
# students if you care about a stable app signing key.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python reference crypto
        run: |
          python -m pip install cryptography
          python tools/self_test.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        shell: bash
        run: |
          flutter create --platforms=android --org=com.coursepack --project-name=app "$RUNNER_TEMP/coursepack-platform-seed"
          cp -R "$RUNNER_TEMP/coursepack-platform-seed/android" ./android
          sed -i 's/android:label="app"/android:label="CoursePack"/' android/app/src/main/AndroidManifest.xml

      - name: Restore signing key
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/coursepack-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=${KEYSTORE_PATH}
          EOF
          echo "Signing config written."

      - name: Dependencies
        run: flutter pub get

      - name: Analyse
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoursePack-Android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: flutter build apk --release

      - name: Upload release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: CoursePack-Android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
