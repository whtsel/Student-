name: Build CoursePack

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK (debug / pipeline check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify Python reference crypto
        run: |
          python -m pip install cryptography
          python tools/self_test.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        shell: bash
        run: |
          flutter create --platforms=android --org=com.coursepack --project-name=app "$RUNNER_TEMP/coursepack-platform-seed"
          cp -R "$RUNNER_TEMP/coursepack-platform-seed/android" ./android
          sed -i 's/android:label="app"/android:label="CoursePack"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Test and build
        shell: bash
        run: |
          flutter pub get
          set +e
          flutter analyze --no-pub --no-fatal-infos > "$RUNNER_TEMP/flutter-analyze.log" 2>&1
          analyze_status=$?
          set -e
          cat "$RUNNER_TEMP/flutter-analyze.log"
          if [ "$analyze_status" -ne 0 ]; then
            { head -n 18 "$RUNNER_TEMP/flutter-analyze.log"; tail -n 12 "$RUNNER_TEMP/flutter-analyze.log"; } | while IFS= read -r line; do
              echo "::error title=Flutter analyze output::$line"
            done
            exit "$analyze_status"
          fi
          set +e
          flutter test --reporter expanded > "$RUNNER_TEMP/flutter-test.log" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/flutter-test.log"
          if [ "$test_status" -ne 0 ]; then
            { head -n 18 "$RUNNER_TEMP/flutter-test.log"; tail -n 12 "$RUNNER_TEMP/flutter-test.log"; } | while IFS= read -r line; do
              echo "::error title=Flutter test output::$line"
            done
            exit "$test_status"
          fi
          flutter build apk --debug

      - uses: actions/upload-artifact@v7
        with:
          name: CoursePack-Android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows app folder
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        shell: pwsh
        run: |
          flutter create --platforms=windows --org=com.coursepack --project-name=app "$env:RUNNER_TEMP/coursepack-platform-seed"
          Copy-Item -Recurse "$env:RUNNER_TEMP/coursepack-platform-seed/windows" ./windows
          $rcPath = 'windows/runner/Runner.rc'
          $rc = Get-Content $rcPath -Raw
          $rc = $rc.Replace('"Runner"', '"CoursePack"')
          [System.IO.File]::WriteAllText((Resolve-Path $rcPath), $rc, [System.Text.UTF8Encoding]::new($false))

      - name: Build and package
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          $release = 'build/windows/x64/runner/Release'
          $package = Join-Path $env:RUNNER_TEMP 'CoursePack'
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item -Recurse "$release/*" $package
          Compress-Archive -Path $package -DestinationPath 'CoursePack-Windows.zip'

      - uses: actions/upload-artifact@v7
        with:
          name: CoursePack-Windows
          path: CoursePack-Windows.zip
          if-no-files-found: error
          retention-days: 14
