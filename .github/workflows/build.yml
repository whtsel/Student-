name: Build CoursePack Apps

# Builds the Android apps in the cloud and uploads the APKs.
# The owner's machine cannot install Flutter or the Android SDK, so all
# compilation happens here.
#
# Two installable apps are built:
#   * the licence generator (root app) — seller-side
#   * the player (apps/player) — student-side, licence-gated encrypted playback
#
# The shared crypto and licence code lives in the pure-Dart packages under
# packages/ and is tested in its own context (`dart test`/`dart analyze`
# per package) because it has no Flutter dependency. Each app's own widget
# tests run under `flutter test` in its own directory.
#
# One-time setup for a signed release APK:
#   Settings -> Secrets and variables -> Actions -> New repository secret:
#     KEYSTORE_BASE64    base64 of your coursepack-keystore.jks
#     KEYSTORE_PASSWORD  the store password
#     KEY_PASSWORD       the key password (usually the same)
#     KEY_ALIAS          coursepack
# Without these the workflow still builds a debug APK; do not ship it to
# students if you care about a stable app signing key.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Expose the signing secrets as workflow-level env so their presence can be
# tested in step `if:` conditions (the `secrets` context is not allowed
# there, and job-level env is not reliably visible to step `if`).
env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python reference crypto
        run: |
          python -m pip install cryptography
          python tools/self_test.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        shell: bash
        run: |
          flutter create --platforms=android --org=com.coursepack --project-name=app "$RUNNER_TEMP/coursepack-platform-seed"
          cp -R "$RUNNER_TEMP/coursepack-platform-seed/android" ./android
          sed -i 's/android:label="app"/android:label="CoursePack"/' android/app/src/main/AndroidManifest.xml

      - name: Restore signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/coursepack-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          printf '%s\n' \
            "storePassword=${KEYSTORE_PASSWORD}" \
            "keyPassword=${KEY_PASSWORD}" \
            "keyAlias=${KEY_ALIAS}" \
            "storeFile=${KEYSTORE_PATH}" > android/key.properties
          echo "Signing config written."

      - name: Dependencies
        run: flutter pub get

      - name: Package tests — coursepack_crypto
        run: |
          cd packages/coursepack_crypto
          dart pub get
          dart analyze
          dart test

      - name: Package tests — coursepack_licence
        run: |
          cd packages/coursepack_licence
          dart pub get
          dart analyze
          dart test

      - name: Encrypter tests — coursepack_encrypter
        run: |
          cd tools/encrypt_video
          dart pub get
          dart analyze
          dart test

      - name: Analyse
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoursePack-Android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: flutter build apk --release

      - name: Upload release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: CoursePack-Android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  player:
    name: Player Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate player Android runner
        shell: bash
        run: |
          cd apps/player
          flutter create --platforms=android --org=com.coursepack \
            --project-name=coursepack_player "$RUNNER_TEMP/player-platform-seed"
          cp -R "$RUNNER_TEMP/player-platform-seed/android" ./android
          # Set a friendly app label regardless of the generated project name.
          sed -i 's/android:label="[^"]*"/android:label="CoursePack Player"/' \
            android/app/src/main/AndroidManifest.xml
          # video_player requires minSdk >= 24. Flutter may generate Groovy
          # (build.gradle: minSdkVersion) or Kotlin DSL (build.gradle.kts:
          # minSdk); set it in whichever file exists.
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/^([[:space:]]*)minSdkVersion[[:space:]]+.*/\1minSdkVersion 24/' \
              android/app/build.gradle
          elif [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/^([[:space:]]*)minSdk[[:space:]]*=.*/\1minSdk = 24/' \
              android/app/build.gradle.kts
          fi
          grep -rh minSdk android/app/build.gradle* || true

      - name: Restore signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/coursepack-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          printf '%s\n' \
            "storePassword=${KEYSTORE_PASSWORD}" \
            "keyPassword=${KEY_PASSWORD}" \
            "keyAlias=${KEY_ALIAS}" \
            "storeFile=${KEYSTORE_PATH}" > android/key.properties
          echo "Signing config written."

      - name: Player dependencies
        run: |
          cd apps/player
          flutter pub get

      - name: Player analyse
        run: |
          cd apps/player
          flutter analyze --no-pub --no-fatal-infos

      - name: Player test
        run: |
          cd apps/player
          flutter test

      - name: Build player debug APK
        run: |
          cd apps/player
          flutter build apk --debug

      - name: Upload player debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoursePack-Player-Android-debug
          path: apps/player/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build player release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          cd apps/player
          flutter build apk --release

      - name: Upload player release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: CoursePack-Player-Android-release
          path: apps/player/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
