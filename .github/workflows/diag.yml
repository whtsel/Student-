name: Diagnostic analyse log

# Temporary diagnostic workflow: runs `flutter analyze` and pushes the full
# output to a branch so it can be read back (the run-log CDN is not reachable
# from the agent sandbox). Delete after use.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyse (capture full output)
        run: |
          flutter analyze --no-pub --no-fatal-infos > analyze.log 2>&1
          echo "EXIT=$?" >> analyze.log

      - name: Push log to branch
        run: |
          git config user.name "ci-diag"
          git config user.email "ci-diag@example.com"
          git fetch origin arena/ab7e4a0b-student
          git checkout -B ci-diag-log origin/arena/ab7e4a0b-student
          cp analyze.log ./analyze.log
          git add analyze.log
          git commit -m "diag: analyse log" || true
          git push --force origin HEAD:refs/heads/ci-diag-log
