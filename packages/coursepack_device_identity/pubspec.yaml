name: coursepack_device_identity
description: Native CoursePack device fingerprint components for Android and Windows.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.coursepack.device_identity
        pluginClass: CoursePackDeviceIdentityPlugin
      windows:
        pluginClass: CoursePackDeviceIdentityPlugin
